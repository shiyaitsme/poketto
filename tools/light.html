<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生活里的光 · Poketto</title>
<link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../assets/poketto.css">
<script src="../assets/poketto.js" defer></script>
<style>
/* Tool layout; typography, frames and controls come from poketto.css. */
.scenes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.scene{appearance:none;border:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;min-width:0;padding:16px 22px;--l:16px;transition:background-color .2s ease}
.scene:hover{background-color:rgba(185,224,76,.2)}
.scene-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.scene-dot{width:11px;height:11px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--ink)}
.scene[aria-pressed=true] .scene-dot{background:var(--ink)}
.scene strong{display:block;font-size:20px;font-weight:900;line-height:1.3}
.scene:focus-visible{outline:2px solid var(--leaf);outline-offset:4px}
.lab{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr);gap:28px;align-items:start}
.bench-view{position:sticky;top:16px;min-width:0}
.view{position:relative;padding:0;--l:18px;overflow:hidden;min-width:0}
.view canvas{display:block;width:100%;height:clamp(330px,46vh,460px)}
.view-label{position:absolute;top:16px;left:22px;right:22px;color:var(--paper);pointer-events:none}
.legend{font-size:12px;color:var(--ink-2);margin-top:10px}
.controls{padding:18px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.controls p{margin:0;font-size:13px;color:var(--ink-2)}
#inputs{display:grid;gap:18px}
.control{display:grid;gap:8px}
.control label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--ink-2)}
.control output{font-family:var(--mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.presets{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.reset{align-self:flex-start}
.controls .observation{border-top:1px solid var(--ink);padding-top:14px}
.explain{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.explain>div{display:grid;align-content:start;gap:14px;padding:18px 24px;min-width:0}
.explain p{margin:0;font-size:13px;color:var(--ink-2)}
.equation{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.footnote{margin:0;font-size:12px;color:var(--ink-2)}
details{font-size:13px}summary{cursor:pointer}details[open] summary{margin-bottom:10px}
#diagram{display:block;width:100%;height:150px}
@media(max-width:899px){.lab,.explain{grid-template-columns:1fr}.bench-view{position:relative;top:auto}.view canvas{height:clamp(300px,46vh,420px)}}
@media(max-width:560px){.scenes{grid-template-columns:1fr;gap:12px}.scene{padding:12px 20px}.scene-top{margin-bottom:4px}.scene strong{font-size:20px}.controls,.explain>div{padding:16px 20px}.view-label{left:18px;right:18px;font-size:11px}}
</style>
</head>
<body><main class="pk-page">
<div class="pk-bar"><a class="pk-home" href="../index.html" data-pk-wordmark aria-label="回到 Poketto 首页"></a><div class="pk-label"><a href="../index.html" class="pk-zh">口袋工具箱</a> / Light · <span class="pk-zh">物理</span></div></div>
<header class="pk-head"><div class="pk-kicker"><span class="pk-label">Tool No.04</span><span class="pk-label">An everyday light museum</span></div><h1 class="pk-title">生活里的光</h1><svg class="pk-star" viewBox="0 0 40 80" aria-hidden="true"><path d="M20 0 C21.2 26 22.5 33 40 38 C22.5 43 21.2 52 20 80 C18.8 52 17.5 43 0 38 C17.5 33 18.8 26 20 0Z"/></svg><div class="pk-br pk-lead"><p class="pk-verse">天空的蓝，泡泡的彩，池底晃动的光。<br>熟悉的风景里，藏着光的不同走法。<br>换一个条件，看看世界怎么变。</p></div></header>
<nav class="scenes" aria-label="选择光学现象"><button class="scene pk-br" data-scene="sky" aria-pressed="true"><span class="scene-top"><span class="pk-label">01 / SCATTERING</span><span class="scene-dot" aria-hidden="true"></span></span><strong>天空与晚霞</strong></button><button class="scene pk-br" data-scene="film" aria-pressed="false"><span class="scene-top"><span class="pk-label">02 / INTERFERENCE</span><span class="scene-dot" aria-hidden="true"></span></span><strong>肥皂膜的颜色</strong></button><button class="scene pk-br" data-scene="water" aria-pressed="false"><span class="scene-top"><span class="pk-label">03 / REFRACTION</span><span class="scene-dot" aria-hidden="true"></span></span><strong>池底的光纹</strong></button></nav>
<section class="lab" aria-label="光学实验台"><div class="bench-view"><div class="view pk-br"><span class="view-label pk-label" id="scene-label"></span><canvas id="light" role="img" aria-label="随参数变化的光学现象"></canvas></div><div class="legend" id="legend"></div></div><div class="controls pk-br pk-veil"><h2 class="pk-h2"><small>Experiment</small><span id="heading"></span></h2><p id="prompt"></p><div id="inputs"></div><div class="presets" id="presets"></div><button class="reset pk-chip zh" id="reset">恢复这个场景</button><p class="observation" id="observation" aria-live="polite"></p></div></section>
<section class="explain"><div class="pk-br pk-veil"><h3 class="pk-h2"><small>How it works</small>光在做什么？</h3><canvas id="diagram" role="img" aria-label="光学原理示意图"></canvas><div class="equation" id="equation"></div><p id="mechanism"></p></div><div class="pk-br pk-veil"><h3 class="pk-h2"><small>Look closer</small>下次遇见，试着观察</h3><p id="notice"></p><details><summary>关于这个模型</summary><p class="footnote" id="limits"></p></details></div></section>
