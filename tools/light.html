<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活里的光 · Poketto</title>
<link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../assets/poketto.css">
<script src="../assets/poketto.js" defer></script>
<style>
.pk-title{font-size:clamp(48px,9vw,92px)}.intro{max-width:620px}.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.scene{font:inherit;text-align:left;background:transparent;border:1px solid #a4a499;padding:16px;cursor:pointer;color:var(--ink)}.scene span{display:block;font:12px var(--mono);margin-bottom:8px}.scene strong{font-size:19px}.scene[aria-pressed=true]{background:var(--lime);border-color:var(--ink)}.scene:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--leaf);outline-offset:4px}.lab{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(240px,1fr);gap:24px}.view{position:relative;background:#101d2b;min-width:0;overflow:hidden}.view canvas{display:block;width:100%;height:420px}.view-label{position:absolute;top:18px;left:20px;color:#fff;font:12px var(--mono);letter-spacing:.08em;pointer-events:none}.controls{padding:22px;display:flex;flex-direction:column;gap:20px}.controls h2{margin:0;font-size:24px}.controls p{margin:0}.control label{display:flex;justify-content:space-between;gap:10px;font-size:14px}.control output{font-family:var(--mono)}input[type=range]{width:100%;accent-color:var(--leaf);margin-top:12px;cursor:pointer}.presets{display:flex;flex-wrap:wrap;gap:8px}.presets button,.reset{font:inherit;font-size:13px;background:transparent;border:1px solid #a4a499;padding:6px 12px;cursor:pointer}.observation{border-top:1px solid #aaa99d;padding-top:16px;font-size:14px}.explain{display:grid;grid-template-columns:1fr 1fr;gap:30px}.explain h3{font-size:16px;margin:0 0 8px}.explain p{margin:0;font-size:14px}.equation{font-family:var(--mono);font-size:15px;margin:16px 0}.footnote{font-size:12px;color:var(--ink-2)}.legend{display:flex;gap:18px;font-size:12px;margin-top:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}#diagram{width:100%;height:150px;background:rgba(255,255,255,.25)}@media(max-width:700px){.lab,.explain{grid-template-columns:1fr}.scenes{gap:6px}.scene{padding:12px 8px}.scene strong{font-size:15px}.scene span{font-size:10px}.view canvas{height:330px}.controls{padding:12px 0}.pk-page{gap:22px}}
</style>
</head>
<body><main class="pk-page">
<div class="pk-bar"><a class="pk-home" href="../index.html" data-pk-wordmark aria-label="回到 Poketto 首页"></a><div class="pk-label">Light · <span class="pk-zh">物理</span></div></div>
<header class="pk-head"><div class="pk-kicker"><span class="pk-label">Tool No.04</span><span class="pk-label">An everyday light museum</span></div><h1 class="pk-title">生活里的光</h1><div class="pk-br pk-lead intro"><p class="pk-verse">天空的蓝，泡泡的彩，池底晃动的光。<br>熟悉的风景里，藏着光的不同走法。<br>换一个条件，看看世界怎么变。</p></div></header>
<nav class="scenes" aria-label="选择光学现象"><button class="scene" data-scene="sky" aria-pressed="true"><span>01 / SCATTERING</span><strong>天空与晚霞</strong></button><button class="scene" data-scene="film" aria-pressed="false"><span>02 / INTERFERENCE</span><strong>肥皂膜的颜色</strong></button><button class="scene" data-scene="water" aria-pressed="false"><span>03 / REFRACTION</span><strong>池底的光纹</strong></button></nav>
<section class="lab" aria-label="光学实验台"><div><div class="view pk-br"><span class="view-label" id="scene-label"></span><canvas id="light" role="img" aria-label="随参数变化的光学现象"></canvas></div><div class="legend" id="legend"></div></div><div class="controls"><h2 id="heading"></h2><p id="prompt"></p><div id="inputs"></div><div class="presets" id="presets"></div><button class="reset" id="reset">恢复这个场景</button><p class="observation" id="observation" aria-live="polite"></p></div></section>
<section class="explain"><div><h3>光在做什么？</h3><canvas id="diagram" role="img" aria-label="光学原理示意图"></canvas><div class="equation" id="equation"></div><p id="mechanism"></p></div><div><h3>下次遇见，试着观察</h3><p id="notice"></p><details><summary>关于这个模型</summary><p class="footnote" id="limits"></p></details></div></section>
<p class="footnote">同样是彩色，成因可以很不同：散射改变光的去向，干涉改变各波长的反射强度，折射改变光的传播方向。</p>
</main><script src="../assets/light.js"></script></body></html>
