<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>不可能的极光 · Impossible Aurora</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --fg: #e9e6f2; --dim: rgba(233,230,242,.55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05040b; overflow: hidden; }
  body { color: var(--fg); font-family: "Cormorant Garamond", Georgia, "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #art { touch-action: none; cursor: crosshair; }
  #over { pointer-events: none; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
  .fallback[hidden] { display: none; }
  .line { position: absolute; left: 0; right: 0; bottom: 11vh; margin: 0; padding: 0 24px; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 2.4s ease; text-shadow: 0 0 24px rgba(5,4,11,.9); }
  .line.on { opacity: 1; }
  .line .zh { display: block; font-size: clamp(17px, 2.3vw, 26px); letter-spacing: .14em; }
  .line .en { display: block; margin-top: .55em; font-size: clamp(14px, 1.7vw, 20px); font-style: italic; letter-spacing: .04em; color: var(--dim); }
  .mark { position: absolute; top: 20px; left: 24px; margin: 0; pointer-events: none; font-size: 13px; letter-spacing: .18em; color: var(--dim); }
  .mark b { font-weight: 500; color: var(--fg); }
  .tools { position: absolute; top: 14px; right: 16px; display: flex; gap: 4px; opacity: .45; transition: opacity .4s; }
  .tools:hover, .tools:focus-within { opacity: 1; }
  .tools button { font: inherit; font-size: 13px; letter-spacing: .08em; color: var(--fg); background: none; border: 0; padding: 8px 10px; cursor: pointer; }
  .tools button:hover { text-decoration: underline; text-underline-offset: 4px; }
  .tools button[aria-pressed="true"] { color: #f3b6e6; }
  .tools button:focus-visible, #art:focus-visible { outline: 1px solid #f3b6e6; outline-offset: 2px; }
  .toast { position: absolute; top: 56px; right: 24px; margin: 0; font-size: 12px; letter-spacing: .06em; color: var(--dim); opacity: 0; transition: opacity .5s; pointer-events: none; text-align: right; }
  .toast.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .line { transition-duration: .01s; } }
</style>
</head>
<body>
<canvas id="art" tabindex="0" role="img"
  aria-label="Interactive generative aurora. 交互式生成极光。Move the pointer to pull the light; stay still and it fades; click for a burst; optionally use the microphone. 移动指针牵引光，静止则逐渐消散，点击触发爆发，也可以开启麦克风。"></canvas>
<canvas id="over" aria-hidden="true"></canvas>
<div class="fallback" id="fallback" hidden><p>这个浏览器打不开 WebGL2，看不到极光。<br><i>WebGL2 is not available in this browser.</i></p></div>

<p class="mark"><b>不可能的极光</b> &nbsp;Impossible Aurora</p>
<div class="tools" role="group" aria-label="Controls 控制">
  <button type="button" id="micBtn" aria-pressed="false" title="Let sound summon the light 用声音召唤极光">声音 Sound</button>
  <button type="button" id="fsBtn" title="Fullscreen 全屏">全屏 Full</button>
  <button type="button" id="shotBtn" title="Save frame 保存画面">存图 Save</button>
</div>
<p class="toast" id="toast" role="status" aria-live="polite"></p>

<p class="line" id="lineA" aria-live="polite"><span class="zh">你在一个看不到极光的地方。动一动，它就来了。</span><span class="en">You are somewhere the aurora never reaches. Move, and it comes.</span></p>
<p class="line" id="lineB" aria-live="polite"><span class="zh">想象需要被一直维系。</span><span class="en">Imagination has to be kept alive.</span></p>

    mic.an.getFloatTimeDomainData(mic.buf);
    var s = 0; for (var i = 0; i < mic.buf.length; i++) s += mic.buf[i] * mic.buf[i];
    var rms = Math.sqrt(s / mic.buf.length);
    mic.level += (rms - mic.level) * Math.min(dt * 12, 1);
    mic.cool -= dt;
    if (rms > mic.avg * 2.4 + .05 && mic.cool <= 0) { burst((Math.random() - .5) * 500); mic.cool = 1.3; }
    mic.avg += (rms - mic.avg) * Math.min(dt * .6, 1);        // slow baseline, so steady noise is ignored
    return Math.min(1, Math.max(0, mic.level - mic.avg * .8) * 7);
  }

  /* ---- fullscreen / save ---- */
  $('fsBtn').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });
  $('shotBtn').addEventListener('click', function () {
    draw(0);
    var t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height; var c = t.getContext('2d');
    c.drawImage(cv, 0, 0); c.drawImage(ov, 0, 0, cv.width, cv.height);
    var a = document.createElement('a'); a.download = 'impossible-aurora.png'; a.href = t.toDataURL('image/png'); a.click();
  });

  /* ---- abstract horizon: layered ridges, drawn once per resize ---- */
  var ridge = document.createElement('canvas'), ridgeKey = '';
  function buildRidge(W, H, d) {
    var key = W + 'x' + H + '@' + d; if (key === ridgeKey) return; ridgeKey = key;
    ridge.width = Math.round(W * d); ridge.height = Math.round(H * d);
    var c = ridge.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0);
    var tanH = Math.tan(CAM.fov / 2), hy = H / 2 * (1 + Math.tan(CAM.pitch) / tanH);
    var layers = [
      { amp: .060, base: .020, k: 1.7, ph: 1.3, col: 'rgb(18,15,34)', a: .96 },
      { amp: .045, base: .008, k: 2.9, ph: 4.1, col: 'rgb(9,8,19)', a: .98 },
      { amp: .030, base: -.010, k: 4.6, ph: .4, col: 'rgb(3,3,8)', a: 1 }
    ];
    layers.forEach(function (L) {
      c.globalAlpha = L.a; c.fillStyle = L.col; c.beginPath(); c.moveTo(0, H);
      for (var x = 0; x <= W; x += 4) {
        var u = x / W * Math.PI * 2 * L.k + L.ph;
        var y = hy - H * (L.base + L.amp * (.5 + .5 * (Math.sin(u) * .6 + Math.sin(u * 2.7 + 1.1) * .3 + Math.sin(u * 6.1 + 2.3) * .1)));
        c.lineTo(x, y);
      }
      c.lineTo(W, H); c.closePath(); c.fill();
    });
    c.globalAlpha = 1; c.fillStyle = 'rgb(3,3,8)'; c.fillRect(0, hy + H * .02, W, H);   // solid ground below the last ridge
  }

  function drawOverlay(W, H, d) {
    if (ov.width !== Math.round(W * d) || ov.height !== Math.round(H * d)) { ov.width = Math.round(W * d); ov.height = Math.round(H * d); }
    buildRidge(W, H, d);
    ox.setTransform(1, 0, 0, 1, 0, 0); ox.clearRect(0, 0, ov.width, ov.height);
    ox.drawImage(ridge, 0, 0);
    // halation: a soft pink bloom around the core, strongest when the light is alive
    var p = project(S.coreX, 150, 335);
    if (p) {
      var life = S.life, r = H * (.38 + .22 * life);
      ox.setTransform(d, 0, 0, d, 0, 0); ox.globalCompositeOperation = 'lighter';
      var g = ox.createRadialGradient(p[0], p[1], 0, p[0], p[1], r);
      g.addColorStop(0, 'rgba(255,170,225,' + (.05 * life * life).toFixed(3) + ')');
      g.addColorStop(.35, 'rgba(210,120,210,' + (.03 * life).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(120,80,200,0)');
      ox.fillStyle = g; ox.fillRect(0, 0, W, H);
      ox.globalCompositeOperation = 'source-over';
    }
  }

  /* ---- text: opening line, and the line that appears when the light is forgotten ---- */
  var lineA = $('lineA'), lineB = $('lineB'), tA = 0;
  function textStep(dt) {
    tA += dt;
    lineA.classList.toggle('on', tA > 1.2 && tA < 9.5);
    if (S.life > .6) S.seenBright = true;
    if (tA > 12 && S.seenBright && S.life < .22) S.idle += dt; else S.idle = 0;
    lineB.classList.toggle('on', S.idle > 2.5);
  }

  /* ---- main loop ---- */
  var last = performance.now(), W = 1, H = 1;
  function draw(dt) {
    var r = cv.getBoundingClientRect(); W = S.W = r.width; H = S.H = r.height;
    var d = Math.min(window.devicePixelRatio || 1, 2), tg = S.scale * Math.min(d, 1.5);
    var w = Math.max(2, Math.round(W * tg)), h = Math.max(2, Math.round(H * tg));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    gl.viewport(0, 0, cv.width, cv.height);

    var micIn = micStep(dt);
    // life: movement and sound feed it, stillness lets it fade
    S.life = Math.max(.07, Math.min(1, S.life + S.kick * .55 + micIn * dt * 1.4 - dt * .065));
    S.kick = 0;

    var want = 0;
    if (S.hover) { var q = planePoint(S.hover[0], S.hover[1]); if (q) { S.mag = q; want = 1; } }
    S.magOn += (want - S.magOn) * Math.min(dt * 3, 1);
    // the bright core drifts toward where you are, slowly
    var tx = want ? Math.max(-260, Math.min(260, S.mag[0] * .55)) : 70 * Math.sin(S.time * .05);
    S.coreX += (tx - S.coreX) * Math.min(dt * .5, 1);
    S.time += dt * (reduce ? .3 : 1);
    S.burstAge += dt;
    var amp = S.burstAge < 20 ? Math.exp(-S.burstAge * .55) : 0;

    gl.uniform2f(U.R, cv.width, cv.height); gl.uniform1f(U.T, S.time);
    gl.uniform1f(U.uYaw, CAM.yaw); gl.uniform1f(U.uPitch, CAM.pitch); gl.uniform1f(U.uTan, Math.tan(CAM.fov / 2));
    gl.uniform1f(U.uPeak, PEAK); gl.uniform1f(U.uAct, .15 + 1.0 * S.life);
    gl.uniform1f(U.uEye, 0);
    gl.uniform2f(U.uMag, S.mag[0], S.mag[1]); gl.uniform1f(U.uMagOn, S.magOn);
    gl.uniform1f(U.uBurst, amp); gl.uniform1f(U.uBurstAge, S.burstAge); gl.uniform1f(U.uBurstX, S.burstX);
    gl.uniform1i(U.uPal, 0); gl.uniform1i(U.uGround, 2);
    gl.uniform1f(U.uCore, Math.pow(S.life, 1.3)); gl.uniform1f(U.uCoreX, S.coreX); gl.uniform1f(U.uGrain, .05);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    drawOverlay(W, H, d);
  }
  function frame(now) {
    var dt = Math.min((now - last) / 1000, .1); last = now;
    if (!document.hidden) {
      if (test) dt = 0;
      draw(dt); textStep(dt);
      S.ft += (dt * 1000 - S.ft) * .05;       // adaptive resolution, keeps the shader near 30 fps
      if (!test) { if (S.ft > 30 && S.scale > .4) S.scale -= .02; else if (S.ft < 18 && S.scale < 1) S.scale += .01; }
    }
    requestAnimationFrame(frame);
  }
  if (test) { S.scale = .5; var m = /[?&]life=([\d.]+)/.exec(location.search); if (m) S.life = +m[1]; tA = 3; }
  requestAnimationFrame(frame);
  window.__aurora = S;
})();
</script>
</body>
</html>
